<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HMS – ER Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    font-family: 'Courier New', monospace;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    padding: 28px 20px 12px;
  }
  header h1 { font-size: 1.7rem; color: #38bdf8; letter-spacing: 2px; }
  header p  { font-size: 0.85rem; color: #64748b; margin-top: 6px; }

  #canvas-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 10px 40px;
  }
  svg { width: 100%; max-width: 980px; height: auto; }

  /* Entity box */
  .entity-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
  .entity-title { fill: #38bdf8; font-size: 13px; font-weight: bold; font-family: 'Courier New'; }
  .attr-text   { fill: #cbd5e1; font-size: 11px; font-family: 'Courier New'; }
  .pk-text     { fill: #fbbf24; font-size: 11px; font-family: 'Courier New'; font-weight: bold; }
  .fk-text     { fill: #a78bfa; font-size: 11px; font-family: 'Courier New'; }

  /* Relationship diamond */
  .rel-diamond { fill: #0f4c75; stroke: #38bdf8; stroke-width: 1.5; }
  .rel-label   { fill: #38bdf8; font-size: 10px; font-family: 'Courier New'; text-anchor: middle; }

  /* Connecting lines */
  .conn-line { stroke: #475569; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
  .solid-line { stroke: #38bdf8; stroke-width: 1.8; fill: none; }

  /* Cardinality labels */
  .card-label { fill: #f59e0b; font-size: 10px; font-family: 'Courier New'; }

  /* Legend */
  .legend {
    display: flex; gap: 20px; justify-content: center;
    flex-wrap: wrap; padding: 0 20px 30px; font-size: 0.78rem;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; color: #94a3b8; }
  .leg-box { width: 16px; height: 12px; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>🏥 Hospital Management System — ER Diagram</h1>
  <p>UCS310 · Thapar Institute of Engineering &amp; Technology · 2025–26</p>
</header>

<div id="canvas-wrap">
<svg viewBox="0 0 980 680" xmlns="http://www.w3.org/2000/svg">

  <!-- ───── RELATIONSHIP LINES ───── -->

  <!-- Patient ── Appointment -->
  <line class="solid-line" x1="185" y1="160" x2="400" y2="290"/>
  <!-- Doctor ── Appointment -->
  <line class="solid-line" x1="795" y1="160" x2="580" y2="290"/>
  <!-- Appointment ── Treatment -->
  <line class="solid-line" x1="490" y1="355" x2="490" y2="450"/>
  <!-- Appointment ── Billing -->
  <line class="solid-line" x1="490" y1="355" x2="730" y2="460"/>
  <!-- Patient ── Billing (direct FK) -->
  <line class="conn-line" x1="185" y1="200" x2="700" y2="460"/>

  <!-- Cardinality labels -->
  <text class="card-label" x="220" y="220">1</text>
  <text class="card-label" x="385" y="280">N</text>
  <text class="card-label" x="760" y="220">1</text>
  <text class="card-label" x="593" y="284">N</text>
  <text class="card-label" x="494" y="400">1</text>
  <text class="card-label" x="494" y="448">1</text>
  <text class="card-label" x="680" y="420">1</text>
  <text class="card-label" x="735" y="460">1</text>

  <!-- ───── ENTITY: PATIENT ───── -->
  <rect class="entity-box" x="30" y="30" width="200" height="200" rx="8"/>
  <!-- Header bar -->
  <rect fill="#0369a1" x="30" y="30" width="200" height="28" rx="8"/>
  <rect fill="#0369a1" x="30" y="46" width="200" height="12"/>
  <text class="entity-title" x="130" y="50" text-anchor="middle">PATIENT</text>
  <!-- Divider -->
  <line stroke="#38bdf8" stroke-width="1" x1="30" y1="58" x2="230" y2="58"/>
  <!-- Attributes -->
  <text class="pk-text"  x="44" y="78">🔑 patient_id (PK)</text>
  <text class="attr-text" x="44" y="97">full_name</text>
  <text class="attr-text" x="44" y="114">dob</text>
  <text class="attr-text" x="44" y="131">gender</text>
  <text class="attr-text" x="44" y="148">phone</text>
  <text class="attr-text" x="44" y="165">address</text>
  <text class="attr-text" x="44" y="182">blood_group</text>
  <text class="attr-text" x="44" y="199">reg_date</text>

  <!-- ───── ENTITY: DOCTOR ───── -->
  <rect class="entity-box" x="750" y="30" width="200" height="200" rx="8"/>
  <rect fill="#065f46" x="750" y="30" width="200" height="28" rx="8"/>
  <rect fill="#065f46" x="750" y="46" width="200" height="12"/>
  <text class="entity-title" x="850" y="50" text-anchor="middle">DOCTOR</text>
  <line stroke="#38bdf8" stroke-width="1" x1="750" y1="58" x2="950" y2="58"/>
  <text class="pk-text"  x="764" y="78">🔑 doctor_id (PK)</text>
  <text class="attr-text" x="764" y="97">full_name</text>
  <text class="attr-text" x="764" y="114">specialization</text>
  <text class="attr-text" x="764" y="131">phone</text>
  <text class="attr-text" x="764" y="148">email</text>
  <text class="attr-text" x="764" y="165">salary</text>
  <text class="attr-text" x="764" y="182">joining_date</text>

  <!-- ───── ENTITY: APPOINTMENT ───── -->
  <rect class="entity-box" x="360" y="260" width="260" height="180" rx="8"/>
  <rect fill="#3b1764" x="360" y="260" width="260" height="28" rx="8"/>
  <rect fill="#3b1764" x="360" y="276" width="260" height="12"/>
  <text class="entity-title" x="490" y="280" text-anchor="middle">APPOINTMENT</text>
  <line stroke="#38bdf8" stroke-width="1" x1="360" y1="288" x2="620" y2="288"/>
  <text class="pk-text"  x="374" y="308">🔑 appointment_id (PK)</text>
  <text class="fk-text"  x="374" y="325">🔗 patient_id (FK)</text>
  <text class="fk-text"  x="374" y="342">🔗 doctor_id (FK)</text>
  <text class="attr-text" x="374" y="359">appt_date</text>
  <text class="attr-text" x="374" y="376">appt_time</text>
  <text class="attr-text" x="374" y="393">status</text>
  <text class="attr-text" x="374" y="410">['Scheduled'|'Completed'|'Cancelled']</text>

  <!-- ───── ENTITY: TREATMENT ───── -->
  <rect class="entity-box" x="300" y="450" width="230" height="175" rx="8"/>
  <rect fill="#7c3416" x="300" y="450" width="230" height="28" rx="8"/>
  <rect fill="#7c3416" x="300" y="466" width="230" height="12"/>
  <text class="entity-title" x="415" y="470" text-anchor="middle">TREATMENT</text>
  <line stroke="#38bdf8" stroke-width="1" x1="300" y1="478" x2="530" y2="478"/>
  <text class="pk-text"  x="314" y="498">🔑 treatment_id (PK)</text>
  <text class="fk-text"  x="314" y="515">🔗 appointment_id (FK)</text>
  <text class="attr-text" x="314" y="532">diagnosis</text>
  <text class="attr-text" x="314" y="549">medicine</text>
  <text class="attr-text" x="314" y="566">treatment_date</text>
  <text class="attr-text" x="314" y="583">notes</text>

  <!-- ───── ENTITY: BILLING ───── -->
  <rect class="entity-box" x="680" y="450" width="250" height="195" rx="8"/>
  <rect fill="#7c2020" x="680" y="450" width="250" height="28" rx="8"/>
  <rect fill="#7c2020" x="680" y="466" width="250" height="12"/>
  <text class="entity-title" x="805" y="470" text-anchor="middle">BILLING</text>
  <line stroke="#38bdf8" stroke-width="1" x1="680" y1="478" x2="930" y2="478"/>
  <text class="pk-text"  x="694" y="498">🔑 bill_id (PK)</text>
  <text class="fk-text"  x="694" y="515">🔗 patient_id (FK)</text>
  <text class="fk-text"  x="694" y="532">🔗 appointment_id (FK)</text>
  <text class="attr-text" x="694" y="549">amount</text>
  <text class="attr-text" x="694" y="566">payment_status</text>
  <text class="attr-text" x="694" y="583">bill_date</text>
  <text class="attr-text" x="694" y="600">['Pending'|'Paid'|'Cancelled']</text>

  <!-- ───── RELATIONSHIP DIAMONDS ───── -->

  <!-- BOOKS (Patient-Appointment) -->
  <polygon class="rel-diamond"
    points="310,240 340,257 310,274 280,257"
  />
  <text class="rel-label" x="310" y="261">BOOKS</text>

  <!-- HANDLES (Doctor-Appointment) -->
  <polygon class="rel-diamond"
    points="670,240 700,257 670,274 640,257"
  />
  <text class="rel-label" x="670" y="261">HANDLES</text>

  <!-- HAS (Appointment-Treatment) -->
  <polygon class="rel-diamond"
    points="490,418 520,435 490,452 460,435"
  />
  <text class="rel-label" x="490" y="439">HAS</text>

  <!-- GENERATES (Appointment-Billing) -->
  <polygon class="rel-diamond"
    points="618,402 648,419 618,436 588,419"
  />
  <text class="rel-label" x="618" y="423">GENERATES</text>

</svg>
</div>

<!-- Legend -->
<div class="legend">
  <div class="legend-item">
    <div class="leg-box" style="background:#0369a1; border:1.5px solid #38bdf8;"></div> Patient
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#065f46; border:1.5px solid #38bdf8;"></div> Doctor
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#3b1764; border:1.5px solid #38bdf8;"></div> Appointment
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#7c3416; border:1.5px solid #38bdf8;"></div> Treatment
  </div>
  <div class="legend-item">
    <div class="leg-box" style="background:#7c2020; border:1.5px solid #38bdf8;"></div> Billing
  </div>
  <div class="legend-item">
    <span style="color:#fbbf24;">🔑 PK</span>&nbsp;= Primary Key
  </div>
  <div class="legend-item">
    <span style="color:#a78bfa;">🔗 FK</span>&nbsp;= Foreign Key
  </div>
  <div class="legend-item">
    <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#38bdf8" stroke-width="2"/></svg> Relationship
  </div>
</div>

</body>
</html>
